<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 프로젝트 리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .project-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .custom-loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        [onclick] { cursor: pointer; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col lg:flex-row lg:items-center justify-between mb-8 gap-6">
            <div>
                <h1 class="text-4xl font-extrabold text-slate-800 mb-2">HTML 프로젝트 리스트</h1>
                <p class="text-slate-600 italic font-medium">"폴더 내 HTML 파일들을 관리하고 실행하세요."</p>
                <p class="text-xs text-indigo-500 mt-1 font-bold"><i class="fas fa-exclamation-circle mr-1"></i> 파일이 안 열린다면? 실제 파일이 index.html과 같은 경로에 있는지 확인하세요.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <!-- Folder Scan Button -->
                <label for="folder-input" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-2xl font-bold shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-95">
                    <i class="fas fa-folder-open"></i> 폴더 자동 등록
                </label>
                <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden">

                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-4 rounded-2xl font-bold shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95">
                    <i class="fas fa-plus"></i> 직접 추가
                </button>
            </div>
        </header>

        <!-- Search & Filter Bar -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="제목 또는 경로 검색..." 
                       class="w-full pl-11 pr-4 py-3.5 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all glass-card shadow-sm">
            </div>
            <div class="flex gap-2">
                <select id="sort-select" class="px-4 py-3.5 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all glass-card shadow-sm font-semibold text-slate-600">
                    <option value="newest">최신순</option>
                    <option value="oldest">오래된순</option>
                    <option value="abc">이름순</option>
                </select>
            </div>
        </div>

        <!-- Stats -->
        <div id="stats-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="glass-card p-6 rounded-3xl shadow-sm border border-white">
                <p class="text-slate-500 text-xs font-bold mb-1 uppercase tracking-wider text-indigo-500">Total Projects</p>
                <h3 id="total-count" class="text-3xl font-black text-slate-800">0</h3>
            </div>
            <div class="glass-card p-6 rounded-3xl shadow-sm border border-white">
                <p class="text-slate-500 text-xs font-bold mb-1 uppercase tracking-wider text-indigo-500">Last Updated</p>
                <h3 id="last-updated" class="text-xl font-bold text-slate-700">-</h3>
            </div>
            <div class="glass-card p-6 rounded-3xl shadow-sm border border-white">
                <p class="text-slate-500 text-xs font-bold mb-1 uppercase tracking-wider text-indigo-500">Status</p>
                <h3 class="text-xl font-bold text-emerald-600"><i class="fas fa-check-circle mr-1"></i> 연결됨</h3>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content-area" class="relative min-h-[400px]">
            <!-- Loading State -->
            <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center z-10">
                <div class="custom-loader mb-4"></div>
                <p class="text-slate-600 font-medium">데이터를 동기화 중입니다...</p>
            </div>

            <!-- Project Grid -->
            <div id="project-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 pb-20"></div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-24 bg-white/30 rounded-[40px] border-2 border-dashed border-slate-300">
                <div class="bg-white/50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm">
                    <i class="fas fa-folder-open text-3xl text-slate-300"></i>
                </div>
                <p class="text-xl text-slate-600 font-bold">표시할 프로젝트가 없습니다.</p>
                <p class="text-slate-400 mt-2">폴더를 스캔하거나 버튼을 눌러 추가하세요.</p>
            </div>
        </div>
    </div>

    <!-- Modal (Add & Edit) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-4 z-50 backdrop-blur-md">
        <div class="bg-white rounded-[32px] shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-white">
            <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <div>
                    <h2 id="modal-title" class="text-2xl font-black text-slate-800">프로젝트 편집</h2>
                    <p id="modal-subtitle" class="text-slate-500 text-sm">정보가 정확한지 확인하세요.</p>
                </div>
                <button onclick="toggleModal(false)" class="w-10 h-10 rounded-full hover:bg-white shadow-sm flex items-center justify-center text-slate-400 hover:text-slate-600 transition-all">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="project-form" class="p-8 space-y-6">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">프로젝트 명</label>
                    <input type="text" id="project-title" required placeholder="예: 나의 웹 프로젝트" 
                           class="w-full px-5 py-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">상대 경로 (실제 파일 위치)</label>
                    <input type="text" id="project-path" required placeholder="예: page.html 또는 folder/sub.html" 
                           class="w-full px-5 py-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    <p class="text-[10px] text-slate-400 mt-2 ml-1">* index.html 파일과 같은 폴더에 있다면 파일명만 적으세요.</p>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">설명</label>
                    <textarea id="project-desc" rows="3" placeholder="간략한 설명..." 
                              class="w-full px-5 py-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all resize-none"></textarea>
                </div>
                <div class="pt-2 flex gap-4">
                    <button type="button" onclick="toggleModal(false)" class="flex-1 py-4 rounded-2xl bg-slate-100 font-bold text-slate-600 hover:bg-slate-200 transition-all">취소</button>
                    <button type="submit" id="submit-btn" class="flex-[1.5] py-4 rounded-2xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 shadow-lg transition-all active:scale-95">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Modal (Delete) -->
    <div id="confirm-overlay" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-4 z-[60] backdrop-blur-sm">
        <div class="bg-white rounded-[32px] shadow-2xl w-full max-w-xs p-8 text-center border border-white">
            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fas fa-trash-alt"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">정말 삭제할까요?</h3>
            <div class="flex gap-3 mt-8">
                <button onclick="closeConfirm()" class="flex-1 py-3 rounded-xl bg-slate-100 font-bold text-slate-600 hover:bg-slate-200 transition-all">취소</button>
                <button id="confirm-delete-btn" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold hover:bg-red-600 shadow-md transition-all">삭제</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-8 py-4 rounded-2xl bg-slate-800 text-white text-sm font-bold shadow-2xl opacity-0 transition-all pointer-events-none z-[100] flex items-center gap-3">
        <i id="toast-icon" class="fas fa-info-circle"></i>
        <span id="toast-message">메시지</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, doc, deleteDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'project-list-app-v2';

        let user = null;
        let allProjects = [];
        let filteredProjects = [];
        let deleteTargetId = null;

        // Authentication Logic
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { 
                console.error("인증 오류:", err); 
                hideLoading(); 
            }
        };

        onAuthStateChanged(auth, (u) => { 
            if (u) { 
                user = u; 
                setupListener(); 
            } 
        });

        // Firestore Real-time Listener
        const setupListener = () => {
            const projectsRef = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
            onSnapshot(projectsRef, (snapshot) => {
                allProjects = [];
                snapshot.forEach(d => allProjects.push({ id: d.id, ...d.data() }));
                applyFilters();
                hideLoading();
            }, (err) => { 
                console.error("데이터베이스 오류:", err); 
                hideLoading(); 
            });
        };

        // Search & Filter Logic
        const applyFilters = () => {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const sortBy = document.getElementById('sort-select').value;
            
            filteredProjects = allProjects.filter(p => 
                p.title.toLowerCase().includes(searchTerm) || 
                p.path.toLowerCase().includes(searchTerm)
            );

            filteredProjects.sort((a, b) => {
                if (sortBy === 'newest') return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
                if (sortBy === 'oldest') return (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
                if (sortBy === 'abc') return a.title.localeCompare(b.title);
                return 0;
            });
            
            renderGrid();
        };

        // UI Rendering
        const renderGrid = () => {
            const grid = document.getElementById('project-grid');
            const empty = document.getElementById('empty-state');
            document.getElementById('total-count').innerText = allProjects.length;
            
            const newest = [...allProjects].sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))[0];
            document.getElementById('last-updated').innerText = newest?.createdAt ? newest.createdAt.toDate().toLocaleDateString() : '-';

            if (filteredProjects.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                grid.classList.remove('hidden');
                grid.innerHTML = '';
                filteredProjects.forEach(p => grid.appendChild(createCard(p)));
            }
        };

        const createCard = (p) => {
            const div = document.createElement('div');
            div.className = 'project-card glass-card rounded-[32px] overflow-hidden flex flex-col h-full shadow-sm';
            div.innerHTML = `
                <div class="h-24 bg-gradient-to-br from-indigo-50 to-white flex items-center justify-center relative group">
                    <i class="fas fa-file-code text-3xl text-indigo-300"></i>
                    <div class="absolute top-4 right-4 flex gap-2">
                        <button onclick="window.openEditModal('${p.id}')" class="w-8 h-8 rounded-full bg-white shadow-sm hover:bg-indigo-600 hover:text-white flex items-center justify-center text-slate-400 transition-all"><i class="fas fa-edit text-[10px]"></i></button>
                        <button onclick="window.askDelete('${p.id}')" class="w-8 h-8 rounded-full bg-white shadow-sm hover:bg-red-500 hover:text-white flex items-center justify-center text-slate-400 transition-all"><i class="fas fa-trash text-[10px]"></i></button>
                    </div>
                </div>
                <div class="p-6 flex-grow">
                    <h4 class="text-lg font-bold text-slate-800 mb-1 truncate" title="${p.title}">${p.title}</h4>
                    <p class="text-slate-500 text-xs mb-4 line-clamp-2">${p.description || '설명 없음'}</p>
                    <div class="text-[10px] bg-slate-100 text-slate-400 p-2 rounded-lg truncate flex items-center gap-2 font-mono">
                        <i class="fas fa-link text-[8px]"></i> ${p.path}
                    </div>
                </div>
                <div class="p-6 pt-0">
                    <a href="${p.path}" target="_blank" class="block w-full text-center py-3 rounded-xl bg-slate-800 text-white font-bold text-xs hover:bg-indigo-600 transition-all shadow-md flex items-center justify-center gap-2">
                        열기 <i class="fas fa-external-link-alt text-[8px]"></i>
                    </a>
                </div>
            `;
            return div;
        };

        // Folder Scanning Feature
        document.getElementById('folder-input').addEventListener('change', async (event) => {
            if (!user) return;
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const htmlFiles = Array.from(files).filter(f => f.name.endsWith('.html') && f.name !== 'index.html');
            if (htmlFiles.length === 0) { 
                showToast("추가할 HTML 파일이 없습니다.", "error"); 
                return; 
            }

            showToast(`${htmlFiles.length}개의 파일을 분석 중...`);
            const projectsRef = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
            let count = 0;

            for (const file of htmlFiles) {
                // Generate relative path correctly
                const pathParts = file.webkitRelativePath.split('/');
                pathParts.shift(); // Remove root folder name
                const relativePath = pathParts.join('/') || file.name;

                // Duplicate check
                if (!allProjects.some(p => p.path === relativePath)) {
                    await addDoc(projectsRef, {
                        title: file.name,
                        path: relativePath,
                        description: '자동 등록된 파일',
                        createdAt: Timestamp.now()
                    });
                    count++;
                }
            }
            showToast(`${count}개의 프로젝트를 성공적으로 등록했습니다!`, "success");
            event.target.value = '';
        });

        // Modal Control Functions
        window.openAddModal = () => {
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-title').innerText = '새 프로젝트 등록';
            document.getElementById('project-form').reset();
            toggleModal(true);
        };

        window.openEditModal = (id) => {
            const p = allProjects.find(i => i.id === id);
            if (!p) return;
            document.getElementById('edit-id').value = id;
            document.getElementById('modal-title').innerText = '프로젝트 정보 수정';
            document.getElementById('project-title').value = p.title;
            document.getElementById('project-path').value = p.path;
            document.getElementById('project-desc').value = p.description || '';
            toggleModal(true);
        };

        window.toggleModal = (s) => {
            const m = document.getElementById('modal-overlay');
            m.classList.toggle('hidden', !s);
            m.classList.toggle('flex', s);
        };

        // Form Submission Logic
        document.getElementById('project-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!user) return;
            
            const editId = document.getElementById('edit-id').value;
            const data = {
                title: document.getElementById('project-title').value,
                path: document.getElementById('project-path').value,
                description: document.getElementById('project-desc').value,
                updatedAt: Timestamp.now()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', editId), data);
                } else {
                    data.createdAt = Timestamp.now();
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), data);
                }
                toggleModal(false);
                showToast("성공적으로 저장되었습니다.", "success");
            } catch (err) { 
                showToast("저장에 실패했습니다.", "error"); 
            }
        };

        // Delete Logic
        window.askDelete = (id) => {
            deleteTargetId = id;
            document.getElementById('confirm-overlay').classList.remove('hidden');
            document.getElementById('confirm-overlay').classList.add('flex');
        };

        window.closeConfirm = () => {
            deleteTargetId = null;
            document.getElementById('confirm-overlay').classList.add('hidden');
            document.getElementById('confirm-overlay').classList.remove('flex');
        };

        document.getElementById('confirm-delete-btn').onclick = async () => {
            if (!user || !deleteTargetId) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', deleteTargetId));
                showToast("삭제되었습니다.");
                closeConfirm();
            } catch (err) {
                showToast("삭제에 실패했습니다.", "error");
            }
        };

        // Event Listeners for UI interaction
        document.getElementById('search-input').oninput = applyFilters;
        document.getElementById('sort-select').onchange = applyFilters;

        // Utility Helpers
        const hideLoading = () => document.getElementById('loading-spinner').classList.add('hidden');
        
        const showToast = (m, t = "info") => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = m;
            toast.className = `fixed bottom-8 left-1/2 -translate-x-1/2 px-8 py-4 rounded-2xl text-white text-sm font-bold shadow-2xl opacity-1 transition-all z-[100] flex items-center gap-3 ${t === "error" ? "bg-red-600" : (t === "success" ? "bg-emerald-600" : "bg-slate-800")}`;
            toast.style.bottom = '48px';
            setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.bottom = '32px'; 
            }, 3000);
        };

        // App Initializer
        window.onload = () => initAuth();
    </script>
</body>
</html>
