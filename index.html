<!DOCTYPE html>
<html lang="ko" class="transition-colors duration-300">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Hub | bobostar-ai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Tailwind 다크모드 설정 활성화
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    body { font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif; }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .dark .glass-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .file-button {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .file-button:hover {
      transform: translateY(-4px);
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-200 transition-colors duration-300">

  <div class="max-w-4xl mx-auto px-6 py-12">
    <!-- Header Section -->
    <header class="mb-12">
      <div class="flex justify-between items-start mb-6">
        <div class="inline-flex items-center justify-center p-3 bg-blue-600 text-white rounded-2xl shadow-lg">
          <i data-lucide="folder-git-2" class="w-8 h-8"></i>
        </div>
        <!-- Theme Toggle Button -->
        <button id="themeToggle" class="p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm text-slate-600 dark:text-yellow-400 hover:scale-110 transition-transform">
          <i data-lucide="sun" id="sunIcon" class=""></i>
          <i data-lucide="moon" id="moonIcon" class="hidden"></i>
        </button>
      </div>

      <div class="text-center md:text-left">
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">HTML Project Hub</h1>
        <p class="text-slate-500 dark:text-slate-400">필요한님의 리포지토리에 저장된 창의적인 작업물들입니다.</p>
        
        <div class="mt-4 flex flex-wrap justify-center md:justify-start gap-2">
          <span class="px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center gap-1 shadow-sm">
            <i data-lucide="user" class="w-3 h-3"></i> bobostar-ai
          </span>
          <span class="px-3 py-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center gap-1 shadow-sm">
            <i data-lucide="github" class="w-3 h-3"></i> html-Project
          </span>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="mt-8 relative max-w-md mx-auto md:mx-0">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
        </div>
        <input type="text" id="searchInput" placeholder="프로젝트 이름으로 검색..." 
               class="block w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all dark:text-white outline-none">
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="glass-card rounded-3xl p-6 md:p-10 shadow-xl min-h-[400px]">
      <!-- Loading State -->
      <div id="loading" class="flex flex-col items-center justify-center py-20">
        <div class="spinner w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full mb-4"></div>
        <p class="text-slate-400 animate-pulse">프로젝트를 동기화 중입니다...</p>
      </div>

      <!-- Result Grid -->
      <div id="fileGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 hidden">
        <!-- Buttons will be injected here -->
      </div>

      <!-- Status Messages -->
      <div id="errorMessage" class="hidden text-center py-10">
        <i data-lucide="alert-circle" class="w-12 h-12 text-red-400 mx-auto mb-4"></i>
        <p class="text-slate-600 dark:text-slate-300 font-medium">네트워크 연결을 확인해 주세요.</p>
        <button onclick="fetchFiles()" class="mt-4 text-blue-600 hover:underline text-sm font-semibold">다시 로드하기</button>
      </div>
      
      <div id="emptyMessage" class="hidden text-center py-20">
        <i data-lucide="file-search" class="w-12 h-12 text-slate-300 dark:text-slate-600 mx-auto mb-4"></i>
        <p class="text-slate-400 dark:text-slate-500">검색 결과와 일치하는 파일이 없습니다.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-slate-400 text-sm">
      <p>&copy; 2024 bobostar-ai. All rights reserved.</p>
    </footer>
  </div>

  <script>
    const username = 'bobostar-ai';
    const repo = 'html-Project';
    const branch = 'main';
    let allFiles = []; // 캐시용 변수

    // 다크모드 토글 로직
    const themeToggle = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function updateTheme() {
      if (document.documentElement.classList.contains('dark')) {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      } else {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      }
      lucide.createIcons();
    }

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      updateTheme();
    });

    // 검색 필터링 로직
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      renderFiles(e.target.value);
    });

    async function fetchFiles() {
      const grid = document.getElementById('fileGrid');
      const loader = document.getElementById('loading');
      const errorMsg = document.getElementById('errorMessage');
      const emptyMsg = document.getElementById('emptyMessage');

      loader.classList.remove('hidden');
      grid.classList.add('hidden');
      errorMsg.classList.add('hidden');
      emptyMsg.classList.add('hidden');

      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/?ref=${branch}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();

        allFiles = data.filter(file => 
          file.type === 'file' && 
          file.name.endsWith('.html') && 
          file.name !== 'index.html'
        );

        renderFiles();
      } catch (error) {
        errorMsg.classList.remove('hidden');
        loader.classList.add('hidden');
        console.error(error);
      }
    }

    function renderFiles(filter = '') {
      const grid = document.getElementById('fileGrid');
      const loader = document.getElementById('loading');
      const emptyMsg = document.getElementById('emptyMessage');
      
      const filtered = allFiles.filter(file => 
        file.name.toLowerCase().includes(filter.toLowerCase())
      );

      grid.innerHTML = '';
      loader.classList.add('hidden');

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        emptyMsg.classList.remove('hidden');
      } else {
        emptyMsg.classList.add('hidden');
        grid.classList.remove('hidden');
        
        filtered.forEach((file, index) => {
          const displayName = file.name.replace('.html', '');
          const card = document.createElement('a');
          card.href = `https://${username}.github.io/${repo}/${file.name}`;
          card.target = "_blank";
          card.className = "file-button flex items-center p-5 bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-2xl shadow-sm hover:border-blue-300 dark:hover:border-blue-500 group";
          
          card.innerHTML = `
            <div class="flex-shrink-0 w-12 h-12 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-xl flex items-center justify-center mr-4 group-hover:bg-blue-600 group-hover:text-white transition-all">
              <span class="text-sm font-bold">${index + 1}</span>
            </div>
            <div class="flex-grow">
              <h3 class="font-semibold text-slate-800 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors truncate">${displayName}</h3>
              <p class="text-xs text-slate-400 dark:text-slate-500">클릭하여 페이지 확인</p>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:translate-x-1 transition-transform"></i>
          `;
          grid.appendChild(card);
        });
        lucide.createIcons();
      }
    }

    // 초기 실행
    window.onload = () => {
      // 로컬 스토리지 테마 확인
      if (localStorage.getItem('theme') === 'dark' || 
          (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      updateTheme();
      fetchFiles();
    };
  </script>
</body>
</html>
